name: Mobile store preflight

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'public/**'
      - 'store/**'
      - '.github/workflows/mobile-preflight.yml'
  workflow_dispatch:

jobs:
  android-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Generate Android shell
        run: npx cap add android
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify WAE native purchase plugin
        run: |
          node - <<'NODE'
          const pkg = require('./node_modules/capacitor-plugin-cdv-purchase/package.json');
          if (pkg.version !== '13.18.0') throw new Error(`Unexpected purchase plugin ${pkg.version}`);
          console.log(`capacitor-plugin-cdv-purchase ${pkg.version}`);
          NODE
      - name: Enforce Play target API 36
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = 36');
          s = s.replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = 36');
          fs.writeFileSync(p, s);
          if (!/compileSdkVersion\s*=\s*36/.test(s) || !/targetSdkVersion\s*=\s*36/.test(s)) throw new Error('API 36 enforcement failed');
          console.log('compileSdkVersion=36 targetSdkVersion=36');
          NODE
      - name: Verify resolved Google Play Billing 9
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../gradle-release-dependencies.txt
          grep -F "com.android.billingclient:billing:9.0.0" ../gradle-release-dependencies.txt
      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
      - name: Upload preflight AAB
        uses: actions/upload-artifact@v4
        with:
          name: wae-neon-rider-android-preflight
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
